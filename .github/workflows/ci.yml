name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  precommit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: bash tools/precommit.sh
  docker:
    # Mac mini 走 launchd 不用它;这里只证明 Dockerfile 能建出来,不推镜像
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mail2leads:ci .
      - run: docker run --rm mail2leads:ci uv run --no-sync python -c "import mail2leads; print('镜像里能 import')"
