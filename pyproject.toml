[project]
name = "mail2leads"
version = "0.0.0"
description = "把询盘邮件读成销售线索,人确认、人回复"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
claude = [
    "anthropic>=1.7.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.15"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/src/mail2leads"]

[tool.ruff]
line-length = 100
src = ["server/src", "server/tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["server/tests", "tools/tests"]
pythonpath = ["server/src", "tools"]
addopts = "-q"
